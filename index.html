<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kişisel Dijital Ajanda (2026-2027)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 1.5rem; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 1.5rem; }
    
    header { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem 1.5rem; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; }
    .date-picker-wrap { display: flex; align-items: center; gap: 0.75rem; }
    .date-picker-wrap input[type="date"] {
      background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 0.6rem 0.9rem; border-radius: 8px; outline: none; font-size: 0.95rem;
    }

    .progress-bar-wrap { width: 100%; background: #0f172a; border-radius: 8px; height: 10px; overflow: hidden; margin-top: 0.5rem; }
    .progress-bar-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.3s ease; }

    .main-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
    @media (min-width: 768px) { .main-grid { grid-template-columns: 2fr 1fr; } }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
    
    .form-row { display: grid; grid-template-columns: 1fr; gap: 0.6rem; }
    @media (min-width: 600px) { .form-row { grid-template-columns: 2fr 1fr 1fr auto; } }
    
    input, select, textarea, button { border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: var(--text); padding: 0.65rem 0.8rem; font-size: 0.9rem; }
    button { background: var(--primary); color: #000; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
    button:hover { background: var(--primary-hover); color: #fff; }
    
    .task-list { display: flex; flex-direction: column; gap: 0.6rem; max-height: 480px; overflow-y: auto; padding-right: 4px; }
    .task-item { display: flex; align-items: center; justify-content: space-between; background: #0f172a; border: 1px solid var(--border); padding: 0.75rem 1rem; border-radius: 10px; gap: 0.75rem; }
    .task-item.completed { opacity: 0.5; }
    .task-item.completed .task-title { text-decoration: line-through; }
    .task-left { display: flex; align-items: center; gap: 0.75rem; flex: 1; }
    .task-badge { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 6px; text-transform: uppercase; font-weight: bold; }
    .badge-Yüksek { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .badge-Orta { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
    .badge-Düşük { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .btn-delete { background: transparent; color: var(--muted); border: none; font-size: 1.1rem; padding: 0.2rem 0.5rem; }
    .btn-delete:hover { color: var(--danger); background: transparent; }

    textarea { width: 100%; height: 260px; resize: none; line-height: 1.5; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h2 id="displayDate">Günlük Ajanda</h2>
      <p id="statsText" style="color: var(--muted); font-size: 0.85rem; margin-top: 3px;">0 görev tamamlandı</p>
      <div class="progress-bar-wrap">
        <div id="progressBar" class="progress-bar-fill"></div>
      </div>
    </div>
    <div class="date-picker-wrap">
      <label for="datePicker" style="font-size: 0.9rem; color: var(--muted);">Tarih Seç:</label>
      <!-- 2026-2027 sınırlandırması -->
      <input type="date" id="datePicker" min="2026-01-01" max="2027-12-31" />
    </div>
  </header>

  <div class="main-grid">
    <!-- Sol Bölüm: Görevler -->
    <div class="card">
      <h3 style="font-size: 1.1rem;">Görev Ekle & Takip</h3>
      <form id="taskForm" class="form-row">
        <input type="text" id="taskTitle" placeholder="Yeni görev yazın..." required />
        <input type="time" id="taskTime" value="09:00" />
        <select id="taskPriority">
          <option value="Yüksek">Yüksek</option>
          <option value="Orta" selected>Orta</option>
          <option value="Düşük">Düşük</option>
        </select>
        <button type="submit">+ Ekle</button>
      </form>

      <div class="task-list" id="taskList"></div>
    </div>

    <!-- Sağ Bölüm: Günlük Notlar -->
    <div class="card">
      <h3 style="font-size: 1.1rem;">Günün Notları</h3>
      <textarea id="dailyNotes" placeholder="Seçili güne özel notlar, toplantı özetleri veya hedefler..."></textarea>
      <small style="color: var(--muted); font-size: 0.75rem;">*Yazdığınız her not seçtiğiniz güne otomatik kaydedilir.</small>
    </div>
  </div>
</div>

<script>
  const datePicker = document.getElementById("datePicker");
  const displayDate = document.getElementById("displayDate");
  const taskList = document.getElementById("taskList");
  const taskForm = document.getElementById("taskForm");
  const dailyNotes = document.getElementById("dailyNotes");
  const statsText = document.getElementById("statsText");
  const progressBar = document.getElementById("progressBar");

  // Varsayılan tarihi belirle
  const today = new Date().toISOString().split("T")[0];
  datePicker.value = (today >= "2026-01-01" && today <= "2027-12-31") ? today : "2026-09-28";

  function getStorageKey(type, date) {
    return `ajanda_${type}_${date}`;
  }

  function loadDay(date) {
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const dateObj = new Date(date + "T00:00:00");
    displayDate.innerText = dateObj.toLocaleDateString("tr-TR", options);

    // Notları yükle
    const savedNotes = localStorage.getItem(getStorageKey("notes", date)) || "";
    dailyNotes.value = savedNotes;

    // Görevleri yükle
    renderTasks();
  }

  function getTasks(date) {
    return JSON.parse(localStorage.getItem(getStorageKey("tasks", date)) || "[]");
  }

  function saveTasks(date, tasks) {
    localStorage.setItem(getStorageKey("tasks", date), JSON.stringify(tasks));
  }

  function renderTasks() {
    const curDate = datePicker.value;
    const tasks = getTasks(curDate);
    taskList.innerHTML = "";

    let completedCount = 0;

    tasks.forEach((t, index) => {
      if (t.completed) completedCount++;

      const div = document.createElement("div");
      div.className = `task-item ${t.completed ? 'completed' : ''}`;
      div.innerHTML = `
        <div class="task-left">
          <input type="checkbox" ${t.completed ? "checked" : ""} onchange="toggleTask(${index})">
          <div>
            <div class="task-title">${t.title}</div>
            <div style="font-size: 0.8rem; color: var(--muted);">${t.time || ""}</div>
          </div>
        </div>
        <span class="task-badge badge-${t.priority}">${t.priority}</span>
        <button class="btn-delete" onclick="deleteTask(${index})" title="Sil">✕</button>
      `;
      taskList.appendChild(div);
    });

    const total = tasks.length;
    statsText.innerText = `${total} görevden ${completedCount} tanesi tamamlandı`;
    progressBar.style.width = total > 0 ? `${(completedCount / total) * 100}%` : "0%";
  }

  window.toggleTask = function(index) {
    const curDate = datePicker.value;
    const tasks = getTasks(curDate);
    tasks[index].completed = !tasks[index].completed;
    saveTasks(curDate, tasks);
    renderTasks();
  };

  window.deleteTask = function(index) {
    const curDate = datePicker.value;
    const tasks = getTasks(curDate);
    tasks.splice(index, 1);
    saveTasks(curDate, tasks);
    renderTasks();
  };

  taskForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const curDate = datePicker.value;
    const title = document.getElementById("taskTitle").value.trim();
    const time = document.getElementById("taskTime").value;
    const priority = document.getElementById("taskPriority").value;

    if (!title) return;

    const tasks = getTasks(curDate);
    tasks.push({ title, time, priority, completed: false });
    saveTasks(curDate, tasks);

    document.getElementById("taskTitle").value = "";
    renderTasks();
  });

  dailyNotes.addEventListener("input", (e) => {
    const curDate = datePicker.value;
    localStorage.setItem(getStorageKey("notes", curDate), e.target.value);
  });

  datePicker.addEventListener("change", (e) => {
    loadDay(e.target.value);
  });

  // İlk yükleme
  loadDay(datePicker.value);
</script>
</body>
</html>
